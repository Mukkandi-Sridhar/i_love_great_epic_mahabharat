services:
  - type: web
    name: ilgem-chatbot
    runtime: python
    # Modules import as `backend.*`, so the service runs from the repo root and
    # targets `backend.main:app` rather than `main:app`.
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      # Payments fail closed without these: /create-razorpay-order returns 503
      # and the Razorpay webhook is ignored when its secret is unset.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Must list the deployed frontend origin(s). The built-in default is
      # localhost-only, which blocks the production site in the browser.
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      # Rate limiting and the auth/blocked caches are in-process. More than one
      # worker multiplies the effective limits, so keep this at 1 until they are
      # moved to shared storage (see backend/core/rate_limit.py).
      - key: WEB_CONCURRENCY
        value: "1"
